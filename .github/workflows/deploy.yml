name: CI/CD Pipeline Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # STEP 1: Code Linting and Testing
  test:
    name: Test and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/backend/pom.xml

      - name: Test Java Backend
        working-directory: backend/backend
        run: ./mvnw --batch-mode test

      # Setup Node.js for Vite/React Frontend
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: Frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: Frontend
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

  # STEP 2: Build & Push Docker Images
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/backend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/fullstack-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/fullstack-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # STEP 3: Continuous Deployment (CD)
  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_PATH,DOCKER_HUB_USERNAME,DOCKER_HUB_TOKEN
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            git pull --ff-only
            printf '%s' "$DOCKER_HUB_TOKEN" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin
            export DOCKER_HUB_USERNAME
            docker compose config --quiet
            docker compose pull
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
