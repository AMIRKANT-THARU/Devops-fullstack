spring.application.name=backend
server.port=8081

# Zero-setup development database. Data is kept in backend/data/schooldb.mv.db.
# Embedded mode avoids opening an additional H2 TCP server during startup.
# Run only one backend instance against this file.
spring.datasource.url=jdbc:h2:file:./data/schooldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Keep request validation strict without making schema upgrades fail for legacy rows.
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Development console: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
