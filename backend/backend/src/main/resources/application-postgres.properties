# Start with: DB_PASSWORD=your_password ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devopsdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:devopsuser}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
